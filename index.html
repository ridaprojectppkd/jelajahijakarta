<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Explorasi Jakarta – Media Belajar Teks Deskripsi</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link
        href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,700;9..144,900&family=Nunito:wght@400;600;800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="app" id="app" data-theme="monas">
        <header class="bar">
            <button id="btnMenu" aria-label="Buka daftar isi">☰</button>
            <div class="prog" role="progressbar" aria-label="Kemajuan belajar"><i id="progFill"></i></div>
            <span id="progTxt">0%</span>
        </header>
  <nav class="nav" aria-label="Navigasi halaman">
    <button id="btnPrev">‹ Kembali</button>
    <span id="pageNo"></span>
    <button id="btnNext" class="primary">Selanjutnya ›</button>
  </nav>
        <main id="screen" tabindex="-1"></main>
        <!-- Lottie Cursor Character -->
<div id="cursorCharacter" aria-hidden="true">
    <lottie-player
        src="assets/lottie/Live chatbot.json"
        background="transparent"
        speed="1"
        loop
        autoplay>
    </lottie-player>
</div>
        <aside class="drawer" id="drawer" aria-hidden="true">
            <h2>Daftar Isi</h2>
            <ol id="toc"></ol>
        </aside>
        <div class="scrim" id="scrim"></div>
    </div>
    <script src="https://unpkg.com/@lottiefiles/lottie-player@latest/dist/lottie-player.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
    <script src="teks.js"></script>
    <script src="script.js"></script>
    <script src="tambahan.js"></script>
    <script>
    document.addEventListener("DOMContentLoaded", () => {
        const app = document.getElementById("app");
        const character = document.getElementById("cursorCharacter");

        if (!app || !character) return;

        app.addEventListener("pointermove", (event) => {
            if (event.pointerType !== "mouse") return;

            const rect = app.getBoundingClientRect();

            const x = event.clientX - rect.left;
            const y = event.clientY - rect.top;

            character.style.left = `${x}px`;
            character.style.top = `${y}px`;
        });
    });
    </script>
</body>

</html>
